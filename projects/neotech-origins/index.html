<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NeoTech Origins | Knightly Arts</title>

    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>

    <!-- Navigation -->
    <header class="fixed top-0 left-0 w-full z-50 bg-black/80 backdrop-blur-md">
        <nav class="max-w-6xl mx-auto px-6 py-5 flex items-center justify-between">

            <a
                href="../../"
                class="text-sm uppercase tracking-widest text-gray-300 hover:text-[#00AEEF] transition"
            >
                Knightly Arts
            </a>

            <div class="flex items-center gap-8">

                <a href="#comic" class="text-sm uppercase tracking-widest text-gray-300 hover:text-[#00AEEF] transition">
                    The Story
                </a>

                <a href="#characters" class="text-sm uppercase tracking-widest text-gray-300 hover:text-[#00AEEF] transition">
                    Characters
                </a>

                <a href="#music" class="text-sm uppercase tracking-widest text-gray-300 hover:text-[#00AEEF] transition">
                    Music
                </a>
            </div>

        </nav>

        <!-- Navigation Accent -->
        <div class="absolute bottom-[-2px] left-0 w-full h-[2px] bg-gradient-to-r from-transparent via-[#00AEEF] to-transparent"></div>
    </header>


    <!-- Hero -->
    <main>

        <section
            id="hero"
            class="neotech-hero min-h-screen flex flex-col justify-center items-center text-center px-6 relative overflow-hidden"
        >

            <!-- Background Effects -->
            <div class="hero-atmosphere"></div>
            <div class="hero-grid"></div>
            <div class="hero-particles"></div>

            <div class="hero-circuits">
                <span class="circuit circuit-1"></span>
                <span class="circuit circuit-2"></span>
                <span class="circuit circuit-3"></span>
                <span class="circuit circuit-4"></span>
                <span class="circuit circuit-5"></span>
                <span class="circuit circuit-6"></span>
            </div>

            <!-- Hero Content -->
            <div class="relative z-10">

                <img
                    src="../../images/NeoTech-Origins-glow.svg"
                    alt="NeoTech Origins"
                    class="w-[20rem] sm:w-[28rem] md:w-[36rem] lg:w-[44rem] h-auto mx-auto"
                >

                <p class="mt-8 text-sm sm:text-base uppercase tracking-[0.4em] text-gray-400">
                    A Story of Progress, Power, and Consequence
                </p>

                <div class="mt-10 h-[2px] w-32 bg-gradient-to-r from-transparent via-[#00AEEF] to-transparent mx-auto"></div>

            </div>

            <!-- Scroll Indicator -->
            <a
                href="#world"
                class="absolute bottom-8 left-1/2 -translate-x-1/2 text-xs uppercase tracking-[0.3em] text-gray-500 hover:text-[#00AEEF] transition"
            >
                Explore
            </a>

        </section>


        <!-- Temporary Section Anchors -->
        <section id="comic" class="min-h-screen"></section>
        <section id="characters" class="min-h-screen"></section>
        <section id="music" class="min-h-screen"></section>

    </main>

</body>
</html>
